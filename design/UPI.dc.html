<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0B2A5B;color:#fff}
  .phone{width:390px;height:844px;background:linear-gradient(180deg,#0B2A5B,#173B7A);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(11,42,91,.18),0 0 0 10px #0B2A5B,0 0 0 12px #1e3a70;margin:24px auto}
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#000;border-radius:20px;z-index:3}
  .status{display:flex;justify-content:space-between;padding:14px 28px 8px;font-size:13px;font-weight:700}
</style>
</helmet>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:41</span><span>••••</span></div>
  <div style="padding:8px 20px 12px;display:flex;justify-content:space-between;align-items:center;">
    <div style="font-size:18px;font-weight:800;">‹ Send money</div>
    <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FDE68A,#F87171);"></div>
  </div>

  <!-- Scan viewport -->
  <div style="margin:8px 20px 14px;background:rgba(255,255,255,0.05);border-radius:22px;padding:22px;text-align:center;">
    <div style="width:200px;height:200px;margin:0 auto;position:relative;background:#0B2A5B;border-radius:16px;overflow:hidden;">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <g fill="#fff">
          <rect x="10" y="10" width="42" height="42"/><rect x="18" y="18" width="26" height="26" fill="#0B2A5B"/><rect x="24" y="24" width="14" height="14" fill="#fff"/>
          <rect x="148" y="10" width="42" height="42"/><rect x="156" y="18" width="26" height="26" fill="#0B2A5B"/><rect x="162" y="24" width="14" height="14" fill="#fff"/>
          <rect x="10" y="148" width="42" height="42"/><rect x="18" y="156" width="26" height="26" fill="#0B2A5B"/><rect x="24" y="162" width="14" height="14" fill="#fff"/>
        </g>
        <g fill="#fff">
          <rect x="62" y="14" width="6" height="6"/><rect x="72" y="14" width="6" height="6"/><rect x="84" y="14" width="12" height="6"/><rect x="102" y="20" width="6" height="6"/><rect x="118" y="14" width="6" height="12"/>
          <rect x="62" y="26" width="12" height="6"/><rect x="80" y="26" width="6" height="12"/><rect x="94" y="26" width="6" height="6"/><rect x="106" y="26" width="12" height="6"/>
          <rect x="60" y="60" width="6" height="6"/><rect x="70" y="66" width="12" height="6"/><rect x="88" y="60" width="6" height="12"/><rect x="102" y="66" width="6" height="6"/><rect x="118" y="60" width="12" height="6"/>
          <rect x="60" y="80" width="12" height="6"/><rect x="80" y="80" width="6" height="12"/><rect x="96" y="80" width="12" height="6"/><rect x="114" y="80" width="6" height="6"/>
          <rect x="62" y="102" width="6" height="12"/><rect x="76" y="108" width="12" height="6"/><rect x="94" y="102" width="6" height="6"/><rect x="106" y="108" width="6" height="6"/><rect x="120" y="102" width="6" height="12"/>
          <rect x="62" y="128" width="12" height="6"/><rect x="80" y="128" width="6" height="6"/><rect x="94" y="128" width="12" height="12"/><rect x="118" y="128" width="6" height="6"/>
          <rect x="62" y="150" width="6" height="6"/><rect x="76" y="150" width="12" height="6"/><rect x="92" y="150" width="6" height="12"/><rect x="106" y="150" width="12" height="6"/><rect x="122" y="156" width="6" height="6"/>
          <rect x="62" y="170" width="12" height="6"/><rect x="80" y="170" width="6" height="12"/><rect x="94" y="170" width="12" height="6"/><rect x="114" y="170" width="6" height="6"/>
        </g>
      </svg>
    </div>
    <div style="font-size:13px;opacity:.85;margin-top:12px;">Point your camera at a UPI QR</div>
  </div>

  <!-- Pay via UPI ID -->
  <div style="margin:0 16px;background:#fff;border-radius:18px;padding:14px;color:#0B2A5B;">
    <div style="font-size:13px;font-weight:800;">Or enter a UPI ID / phone</div>
    <label style="display:flex;align-items:center;gap:10px;background:#F1F5F9;border:1px solid #E2E8F0;border-radius:12px;padding:12px 14px;margin-top:10px;">
      <span style="color:#94A3B8;">@</span>
      <span style="font-weight:600;">priya@upi</span>
    </label>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;">
      <div style="font-size:12px;color:#64748B;font-weight:600;">Amount</div>
      <div style="font-size:12px;color:#22C55E;font-weight:800;">Balance ₹12,480</div>
    </div>
    <div style="font-size:36px;font-weight:900;letter-spacing:-0.02em;">₹ 500<span style="opacity:.4;font-size:20px;">.00</span></div>
    <div style="display:flex;gap:6px;margin-top:10px;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <div style="flex:1;background:#F1F5F9;border-radius:8px;padding:6px 0;text-align:center;font-weight:700;font-size:11.5px;color:#0B2A5B;">₹{{c}}</div>
      </sc-for>
    </div>
    <button style="margin-top:12px;width:100%;background:#22C55E;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:14px;">Pay ₹ 500</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic{renderVals(){return{chips:[100,500,1000,2000]}}}
</script>
</body></html>
