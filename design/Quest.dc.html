<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#EEF3FA;color:#0B2A5B}
  .phone{width:390px;height:844px;background:#fff;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(11,42,91,.18),0 0 0 10px #0B2A5B,0 0 0 12px #1e3a70;margin:24px auto}
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#0B2A5B;border-radius:20px}
  h1{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.02em;font-weight:700}
</style>
</helmet>
<div class="phone">
  <div class="notch"></div>
  <div style="padding:44px 20px 8px;display:flex;justify-content:space-between;align-items:center;">
    <div style="width:32px;height:32px;border-radius:10px;background:#F1F5F9;">‹</div>
    <span style="background:#DCFCE7;color:#166534;font-size:10.5px;font-weight:900;padding:4px 10px;border-radius:999px;">🔥 12-day streak</span>
  </div>

  <!-- Quest hero -->
  <div style="margin:8px 16px 12px;background:linear-gradient(135deg,#7C3AED,#C026D3);border-radius:22px;padding:18px;color:#fff;position:relative;overflow:hidden;">
    <div style="position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.08);"></div>
    <div style="font-size:11px;opacity:.9;font-weight:800;letter-spacing:.08em;text-transform:uppercase;">Active quest · Week 37</div>
    <h1 style="font-size:26px;margin:6px 0 4px;line-height:1.1;">Build your career<br>in 3 steps</h1>
    <div style="font-size:12.5px;opacity:.9;">Finish all 3 to unlock a mentorship call with Zomato Careers.</div>
    <!-- Progress dots -->
    <div style="margin-top:14px;display:flex;align-items:center;gap:6px;">
      <div style="flex:1;height:6px;background:#22C55E;border-radius:999px;"></div>
      <div style="flex:1;height:6px;background:#22C55E;border-radius:999px;"></div>
      <div style="flex:1;height:6px;background:rgba(255,255,255,0.25);border-radius:999px;"></div>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;">2 / 3</span>
    </div>
  </div>

  <!-- Steps -->
  <div style="padding:0 16px 8px;display:flex;flex-direction:column;gap:8px;">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
      <div style="background:{{s.bg}};border:1px solid {{s.border}};border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;">
        <div style="width:44px;height:44px;border-radius:14px;background:{{s.iconBg}};color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;">{{s.icon}}</div>
        <div style="flex:1;">
          <div style="font-weight:800;font-size:14px;color:{{s.fg}};">{{s.title}}</div>
          <div style="font-size:11px;color:{{s.subColor}};">{{s.sub}}</div>
        </div>
        <span style="background:{{s.tagBg}};color:{{s.tagColor}};font-size:10.5px;font-weight:900;padding:4px 10px;border-radius:999px;">{{s.tag}}</span>
      </div>
    </sc-for>
  </div>

  <!-- Reward preview -->
  <div style="margin:12px 16px 8px;background:#0B2A5B;color:#fff;border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;">
    <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#FBBF24,#F59E0B);display:flex;align-items:center;justify-content:center;font-size:26px;">🏆</div>
    <div style="flex:1;">
      <div style="font-weight:800;font-size:13.5px;">Unlock after all 3</div>
      <div style="font-size:11.5px;opacity:.85;">30-min 1:1 mentorship call · Zomato Careers · verified perk</div>
    </div>
  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:14px 16px 22px;background:#fff;border-top:1px solid #E2E8F0;">
    <button style="width:100%;background:#22C55E;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:14px;">Continue step 3 →</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic{renderVals(){return{steps:[
  {icon:'✓',title:'Build a 1-page CV in Gen-Young',sub:'You did this on 4 Sep · +30 XP',tag:'DONE',iconBg:'#22C55E',bg:'#F0FDF4',border:'#BBF7D0',fg:'#065F46',subColor:'#166534',tagBg:'#DCFCE7',tagColor:'#166534'},
  {icon:'✓',title:'Complete the "AI at work" quiz',sub:'Scored 85 · +80 XP · Badge earned',tag:'DONE',iconBg:'#22C55E',bg:'#F0FDF4',border:'#BBF7D0',fg:'#065F46',subColor:'#166534',tagBg:'#DCFCE7',tagColor:'#166534'},
  {icon:'3',title:'Apply to a Career Explorer internship',sub:'One tap · we auto-fill your CV',tag:'DO NOW',iconBg:'#7C3AED',bg:'#F5F3FF',border:'#DDD6FE',fg:'#0B2A5B',subColor:'#64748B',tagBg:'#FBBF24',tagColor:'#78350F'},
]}}}
</script>
</body></html>
