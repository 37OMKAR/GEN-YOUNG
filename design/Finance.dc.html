<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #EEF3FA; color: #0B2A5B; }
  .phone { width: 390px; height: 844px; background: #ffffff; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 30px 60px rgba(11,42,91,0.18), 0 0 0 10px #0B2A5B, 0 0 0 12px #1e3a70; margin: 24px auto; }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 112px; height: 28px; background: #0B2A5B; border-radius: 20px; z-index: 3; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 8px; font-size: 13px; font-weight: 700; color: #0B2A5B; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .brand .g { color: #22C55E; }
  .navitem { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; }
</style>
</helmet>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span style="display:inline-flex; gap:6px; align-items:center;">
      <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="3" height="3" rx="0.5" fill="#0B2A5B"/><rect x="4" y="5" width="3" height="5" rx="0.5" fill="#0B2A5B"/><rect x="8" y="3" width="3" height="7" rx="0.5" fill="#0B2A5B"/><rect x="12" y="1" width="3" height="9" rx="0.5" fill="#0B2A5B"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="3" stroke="#0B2A5B" stroke-width="1.5"/><rect x="3" y="3" width="16" height="6" rx="1.5" fill="#0B2A5B"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#0B2A5B"/></svg>
    </span>
  </div>

  <div style="padding: 6px 20px 8px; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <div class="brand">Gen-<span class="g">Young</span> <svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:-1px"><path d="M4 20c0-8 6-14 16-16-1 10-7 16-16 16z" fill="#22C55E"/></svg></div>
      <div style="color: #64748B; font-size: 11px; font-weight: 500;">Learn Today. A Brighter Tomorrow.</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2A5B" stroke-width="1.8"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/></svg>
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#FDE68A,#F87171); border: 2px solid #22C55E;"></div>
    </div>
  </div>

  <!-- Journey card -->
  <div style="margin: 8px 16px 12px; background: #ffffff; border: 1px solid #E2E8F0; border-radius: 18px; padding: 14px; display: flex; gap: 12px; align-items: center;">
    <div style="flex: 1;">
      <div style="font-size: 18px; font-weight: 800; line-height: 1.15;">Your Financial<br>Learning Journey</div>
      <div style="font-size: 11.5px; color: #64748B; margin-top: 4px;">Small steps. Big possibilities.</div>
    </div>
    <div style="width: 74px; height: 60px; position: relative;">
      <svg width="74" height="60" viewBox="0 0 74 60">
        <rect x="0" y="45" width="16" height="15" fill="#DBEAFE" rx="2"/>
        <rect x="20" y="30" width="16" height="30" fill="#BFDBFE" rx="2"/>
        <rect x="40" y="15" width="16" height="45" fill="#22C55E" rx="2"/>
        <circle cx="68" cy="10" r="4" fill="#DC2626"/>
        <path d="M67 8v5" stroke="#DC2626" stroke-width="1.5"/>
      </svg>
    </div>
  </div>

  <!-- Progress -->
  <div style="margin: 0 16px 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <div style="font-weight: 800; font-size: 13px; color: #0B2A5B;">Your Progress</div>
      <div style="font-size: 11.5px; color: #22C55E; font-weight: 800;">Level 2 · 60% complete</div>
    </div>
    <div style="height: 8px; background: #E2E8F0; border-radius: 999px; overflow: hidden;">
      <div style="width: 60%; height: 100%; background: linear-gradient(90deg,#22C55E,#4ADE80);"></div>
    </div>
  </div>

  <!-- 3 tiles -->
  <div style="margin: 0 16px 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="3">
      <div style="background: {{t.bg}}; border-radius: 14px; padding: 12px 10px; text-align: center;">
        <div style="width: 36px; height: 36px; border-radius: 10px; background: {{t.iconBg}}; color: #fff; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center;" innerHTML="{{t.icon}}"></div>
        <div style="font-weight: 800; color: #0B2A5B; font-size: 13px;">{{t.title}}</div>
        <div style="font-size: 10px; color: #64748B; margin-top: 2px; line-height: 1.3;">{{t.sub}}</div>
      </div>
    </sc-for>
  </div>

  <!-- Featured modules -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px 8px;">
    <div style="font-weight: 800; color: #0B2A5B; font-size: 15px;">Featured Learning Modules</div>
    <a href="#" style="font-size: 12px; font-weight: 700; text-decoration: none; color: #0B2A5B;">See All</a>
  </div>

  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{modules}}" as="m" hint-placeholder-count="3">
      <div style="background: #ffffff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px;">
        <div style="width: 34px; height: 34px; border-radius: 50%; background: {{m.numBg}}; color: {{m.numColor}}; display: flex; align-items: center; justify-content: center; font-weight: 900;">{{m.n}}</div>
        <div style="flex: 1;">
          <div style="font-weight: 800; color: #0B2A5B; font-size: 13px;">{{m.title}}</div>
          <div style="font-size: 10.5px; color: #64748B;">{{m.sub}}</div>
        </div>
        <div style="font-size: 10.5px; color: #64748B; font-weight: 700;">{{m.dur}}</div>
        <div style="width: 28px; height: 28px; border-radius: 50%; background: #DBEAFE; color: #0B82D6; display: flex; align-items: center; justify-content: center;">▶</div>
      </div>
    </sc-for>
  </div>

  <!-- Bottom nav -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #E2E8F0; padding: 10px 8px 22px; display: flex; justify-content: space-around; color:#94A3B8;">
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><path d="M3 12L12 3l9 9v9h-6v-6H9v6H3z"/></svg><div>Home</div></div>
    <div class="navitem" style="color:#0B82D6;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#0B82D6"><path d="M4 6l8-3 8 3z M4 6v6c0 2 4 4 8 4s8-2 8-4V6l-8 3z"/></svg><div>Learn</div></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg><div>Goals</div></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><path d="M5 8h14l-1 12H6z M9 8V6a3 3 0 016 0v2"/></svg><div>Tools</div></div>
    <div class="navitem"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 5-6 8-6s7 2 8 6"/></svg><div>Profile</div></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      tiles: [
        { title: 'Learn', sub: 'Short modules for real life', bg: '#DCFCE7', iconBg: '#16A34A', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M4 6l8-3 8 3-8 3z M4 6v6c0 2 4 4 8 4s8-2 8-4V6l-8 3z"/></svg>' },
        { title: 'Practise', sub: 'Interactive tools and quizzes', bg: '#DBEAFE', iconBg: '#0B82D6', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M5 5h14v14H5z M9 9l6 6 M15 9l-6 6" stroke="#0B82D6" stroke-width="2"/></svg>' },
        { title: 'Apply', sub: 'Use your knowledge in daily life', bg: '#EDE9FE', iconBg: '#7C3AED', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6" stroke="#7C3AED" stroke-width="2" fill="none"/></svg>' },
      ],
      modules: [
        { n: '1', title: 'Budgeting Basics', sub: 'Manage your money better', dur: '15 min', numBg: '#DBEAFE', numColor: '#0B82D6' },
        { n: '2', title: 'Saving for Your Goals', sub: 'Turn dreams into plans', dur: '15 min', numBg: '#DCFCE7', numColor: '#16A34A' },
        { n: '3', title: 'Smart Digital Banking', sub: 'Bank safely and confidently', dur: '10 min', numBg: '#FEF3C7', numColor: '#B45309' },
      ],
    };
  }
}
</script>
</body>
</html>
