<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#EEF3FA;color:#0B2A5B}
  .phone{width:390px;height:844px;background:#fff;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(11,42,91,.18),0 0 0 10px #0B2A5B,0 0 0 12px #1e3a70;margin:24px auto}
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#0B2A5B;border-radius:20px}
</style>
</helmet>
<div class="phone">
  <div class="notch"></div>
  <div style="padding:44px 16px 12px;display:flex;gap:10px;align-items:center;">
    <div style="width:34px;height:34px;border-radius:10px;background:#F1F5F9;display:flex;align-items:center;justify-content:center;">‹</div>
    <label style="flex:1;display:flex;align-items:center;gap:10px;background:#F1F5F9;border:2px solid #0B2A5B;border-radius:12px;padding:9px 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B2A5B" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="color:#0B2A5B;font-weight:600;font-size:14px;">student ai</span>
      <span style="width:1px;height:16px;background:#0B2A5B;animation:blink 1s infinite;"></span>
    </label>
  </div>

  <!-- AI suggestion strip -->
  <div style="margin:0 16px 12px;background:linear-gradient(135deg,#EDE9FE,#DDD6FE);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;">
    <div style="width:32px;height:32px;border-radius:10px;background:#7C3AED;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-family:'Space Grotesk',sans-serif;">✨</div>
    <div style="flex:1;font-size:12.5px;color:#4C1D95;"><b>Ask Gen-Young:</b> "Best free AI benefits for a 21-year-old student"</div>
    <div style="color:#7C3AED;font-weight:900;">›</div>
  </div>

  <!-- Filter chips -->
  <div style="padding:0 16px 12px;display:flex;gap:6px;overflow:hidden;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <div style="background:{{c.bg}};color:{{c.fg}};border:1px solid {{c.border}};padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;">{{c.label}}</div>
    </sc-for>
  </div>

  <!-- Live results -->
  <div style="padding:0 20px 8px;font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:.06em;font-weight:800;">28 results · verified 3 Sep</div>
  <div style="padding:6px 16px;display:flex;flex-direction:column;gap:8px;">
    <sc-for list="{{results}}" as="r" hint-placeholder-count="4">
      <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;">
        <div style="width:42px;height:42px;border-radius:12px;background:{{r.bg}};display:flex;align-items:center;justify-content:center;font-size:20px;">{{r.emoji}}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:800;font-size:13px;">{{r.title}}</div>
          <div style="font-size:11px;color:#64748B;">{{r.tag}} · <span style="color:{{r.metaColor}};font-weight:700;">{{r.meta}}</span></div>
        </div>
        <div style="color:#94A3B8;font-weight:800;">›</div>
      </div>
    </sc-for>
  </div>

  <!-- Recent searches -->
  <div style="padding:8px 20px 8px;font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:.06em;font-weight:800;">Recent</div>
  <div style="padding:0 16px;display:flex;flex-wrap:wrap;gap:6px;">
    <sc-for list="{{recent}}" as="q" hint-placeholder-count="5">
      <div style="background:#F1F5F9;color:#0B2A5B;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:600;">🕐 {{q}}</div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic{renderVals(){return{
  chips:[
    {label:'All',bg:'#0B2A5B',fg:'#fff',border:'#0B2A5B'},
    {label:'Free',bg:'#F1F5F9',fg:'#0B2A5B',border:'#E2E8F0'},
    {label:'For students',bg:'#F1F5F9',fg:'#0B2A5B',border:'#E2E8F0'},
    {label:'Under 30 min',bg:'#F1F5F9',fg:'#0B2A5B',border:'#E2E8F0'},
    {label:'Verified today',bg:'#F1F5F9',fg:'#0B2A5B',border:'#E2E8F0'},
  ],
  results:[
    {title:'Google AI Plus · 1 year student tier',tag:'AI & Learning',meta:'Free · Eligible',metaColor:'#16A34A',emoji:'🤖',bg:'#DBEAFE'},
    {title:'IndiaAI compute credits',tag:'Government scheme',meta:'Free · Check eligibility',metaColor:'#0B82D6',emoji:'⚡',bg:'#EDE9FE'},
    {title:'SATHEE · AI-guided JEE prep',tag:'Education',meta:'Free · Recommended',metaColor:'#16A34A',emoji:'🎓',bg:'#DCFCE7'},
    {title:'SWAYAM · Intro to AI',tag:'Certification',meta:'Free · 6 weeks',metaColor:'#64748B',emoji:'📚',bg:'#FEF3C7'},
  ],
  recent:['upi student','friday drop','free health cover','sustainability course','sos setup'],
}}}
</script>
</body></html>
