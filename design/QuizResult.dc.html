<!doctype html>
<html><head><meta charset="utf-8"><script src="./support.js"></script></head><body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&family=Caveat:wght@600&display=swap">
<style>
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#0B2A5B;color:#fff}
  .phone{width:390px;height:844px;background:linear-gradient(180deg,#0B2A5B,#173B7A 60%,#22C55E 180%);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(11,42,91,.18),0 0 0 10px #0B2A5B,0 0 0 12px #1e3a70;margin:24px auto}
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:112px;height:28px;background:#000;border-radius:20px}
  h1{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.03em;font-weight:700}
</style>
</helmet>
<div class="phone">
  <div class="notch"></div>
  <div style="padding:48px 20px 8px;text-align:center;">
    <div style="font-family:'Caveat',cursive;font-size:24px;color:#FDE68A;">Well done, Aanya!</div>
    <h1 style="font-size:34px;margin:6px 0 4px;line-height:1;">Level up · <span style="color:#22C55E;">2 → 3</span></h1>
    <div style="font-size:13px;opacity:.85;">Budgeting Basics · Chapter complete</div>
  </div>

  <!-- Trophy / score -->
  <div style="margin:20px 16px 12px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:24px;padding:20px;text-align:center;">
    <div style="width:110px;height:110px;margin:0 auto 12px;position:relative;">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBBF24"/><stop offset="1" stop-color="#F59E0B"/></linearGradient></defs>
        <circle cx="55" cy="55" r="46" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="9"/>
        <circle cx="55" cy="55" r="46" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="43" transform="rotate(-90 55 55)"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        <div style="font-family:'Space Grotesk',sans-serif;font-size:32px;font-weight:700;line-height:1;">85</div>
        <div style="font-size:10.5px;opacity:.75;">/ 100</div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-around;">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div>
          <div style="font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:{{s.color}};">{{s.n}}</div>
          <div style="font-size:10.5px;opacity:.8;font-weight:600;">{{s.label}}</div>
        </div>
      </sc-for>
    </div>
  </div>

  <!-- Rewards -->
  <div style="padding:0 16px;font-weight:800;font-size:14px;margin-bottom:8px;">You just unlocked</div>
  <div style="padding:0 16px 8px;display:flex;flex-direction:column;gap:8px;">
    <sc-for list="{{rewards}}" as="r" hint-placeholder-count="3">
      <div style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;">
        <div style="width:36px;height:36px;border-radius:10px;background:{{r.bg}};display:flex;align-items:center;justify-content:center;font-size:18px;">{{r.emoji}}</div>
        <div style="flex:1;">
          <div style="font-weight:800;font-size:13px;">{{r.title}}</div>
          <div style="font-size:11px;opacity:.75;">{{r.sub}}</div>
        </div>
        <span style="background:#22C55E;color:#fff;font-size:10px;font-weight:900;padding:3px 8px;border-radius:999px;">NEW</span>
      </div>
    </sc-for>
  </div>

  <div style="position:absolute;bottom:0;left:0;right:0;padding:14px 16px 22px;background:rgba(11,42,91,0.7);backdrop-filter:blur(8px);display:flex;gap:10px;">
    <button style="flex:1;background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.2);padding:14px;border-radius:12px;font-weight:800;font-size:13px;">Review answers</button>
    <button style="flex:1.2;background:#22C55E;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;font-size:13px;">Next chapter →</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic{renderVals(){return{
  stats:[{n:'4/5',label:'Correct',color:'#22C55E'},{n:'+80',label:'XP earned',color:'#FBBF24'},{n:'🔥13',label:'Day streak',color:'#F97316'}],
  rewards:[
    {title:'Money Explorer · Level 3',sub:'Unlocks weekly quest slots',emoji:'🎖️',bg:'rgba(251,191,36,0.2)'},
    {title:'Sustainable Finance Learner',sub:'Verified badge on your Green Passport',emoji:'🌿',bg:'rgba(34,197,94,0.2)'},
    {title:'Partner perk: 20% off SBI YONO SIP',sub:'Auto-added to your Wallet',emoji:'🎁',bg:'rgba(124,58,237,0.2)'},
  ]
}}}
</script>
</body></html>
