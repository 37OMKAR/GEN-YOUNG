<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap">
<style>
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: #EEF3FA; color: #0B2A5B; }
  .phone { width: 390px; height: 844px; background: #ffffff; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 30px 60px rgba(11,42,91,0.18), 0 0 0 10px #0B2A5B, 0 0 0 12px #1e3a70; margin: 24px auto; }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 112px; height: 28px; background: #0B2A5B; border-radius: 20px; z-index: 3; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 8px; font-size: 13px; font-weight: 700; color: #0B2A5B; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .brand .g { color: #22C55E; }
  .sub { color: #64748B; font-size: 11px; font-weight: 500; }
  .navitem { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; }
</style>
</helmet>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span style="display:inline-flex; gap:6px; align-items:center;">
      <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="3" height="3" rx="0.5" fill="#0B2A5B"/><rect x="4" y="5" width="3" height="5" rx="0.5" fill="#0B2A5B"/><rect x="8" y="3" width="3" height="7" rx="0.5" fill="#0B2A5B"/><rect x="12" y="1" width="3" height="9" rx="0.5" fill="#0B2A5B"/></svg>
      <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="#0B2A5B" stroke-width="1.4"><path d="M1 4a10 10 0 0114 0"/><path d="M3.5 6a7 7 0 019 0"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="3" stroke="#0B2A5B" stroke-width="1.5"/><rect x="3" y="3" width="16" height="6" rx="1.5" fill="#0B2A5B"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#0B2A5B"/></svg>
    </span>
  </div>

  <div style="padding: 6px 20px 8px; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <div class="brand">Gen-<span class="g">Young</span> <svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:-1px"><path d="M4 20c0-8 6-14 16-16-1 10-7 16-16 16z" fill="#22C55E"/></svg></div>
      <div class="sub">Skills for a Brighter Tomorrow.</div>
    </div>
    <div style="display:flex; align-items:center; gap: 12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2A5B" stroke-width="1.8"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#FDE68A,#F87171); border: 2px solid #22C55E;"></div>
    </div>
  </div>

  <!-- Search -->
  <div style="padding: 6px 20px 12px;">
    <label style="display: flex; align-items: center; gap: 10px; background: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 12px; padding: 10px 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span style="color: #94A3B8; font-size: 13px;">Search courses, internships, jobs…</span>
    </label>
  </div>

  <!-- Category pills -->
  <div style="padding: 0 20px 10px; display: flex; gap: 8px;">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1;">
        <div style="width: 40px; height: 40px; border-radius: 50%; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center;" innerHTML="{{c.icon}}"></div>
        <div style="font-size: 9.5px; font-weight: 700; color: {{c.labelColor}};">{{c.label}}</div>
      </div>
    </sc-for>
  </div>

  <!-- Recommended header -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 6px 20px 8px;">
    <div style="font-weight: 800; color: #0B2A5B; font-size: 15px;">Recommended for You</div>
    <a href="#" style="font-size: 12px; font-weight: 700; text-decoration: none; color: #0B2A5B;">See All</a>
  </div>

  <!-- Course cards -->
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{courses}}" as="k" hint-placeholder-count="3">
      <div style="background: #ffffff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px; display: flex; gap: 10px; align-items: center;">
        <div style="width: 68px; height: 60px; border-radius: 10px; background: {{k.imgBg}}; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0;">{{k.emoji}}</div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-weight: 800; color: #0B2A5B; font-size: 13.5px;">{{k.title}}</div>
          <div style="font-size: 11px; color: #64748B; margin-top: 1px;">{{k.sub}}</div>
          <div style="display: flex; gap: 6px; margin-top: 6px;">
            <span style="background:#DBEAFE; color:#1D4ED8; font-size:9.5px; font-weight:700; padding: 2px 7px; border-radius: 999px;">Free</span>
            <span style="background:#F1F5F9; color:#475569; font-size:9.5px; font-weight:700; padding: 2px 7px; border-radius: 999px;">⏱ {{k.dur}}</span>
          </div>
        </div>
        <button style="background: #22C55E; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 11px; flex-shrink: 0;">Start Now</button>
      </div>
    </sc-for>
  </div>

  <!-- Featured Internships -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 8px;">
    <div style="font-weight: 800; color: #0B2A5B; font-size: 15px;">Featured Internships</div>
    <a href="#" style="font-size: 12px; font-weight: 700; text-decoration: none; color: #0B2A5B;">See All</a>
  </div>
  <div style="padding: 0 16px;">
    <div style="background: #ffffff; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px; display: flex; gap: 10px; align-items: center;">
      <div style="width: 62px; height: 54px; border-radius: 10px; background: #DCFCE7; display: flex; align-items: center; justify-content: center; font-size: 24px;">🌱</div>
      <div style="flex: 1;">
        <div style="font-weight: 800; color: #0B2A5B; font-size: 13px;">Sustainability Research Intern</div>
        <div style="font-size: 10.5px; color: #64748B;">Build real-world experience</div>
        <div style="font-size: 10.5px; color: #16A34A; margin-top: 3px; font-weight: 600;">📍 Pan India</div>
      </div>
      <button style="background: #22C55E; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 800; font-size: 11px;">Apply</button>
    </div>
  </div>

  <!-- Bottom nav -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #E2E8F0; padding: 10px 8px 22px; display: flex; justify-content: space-around;">
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><path d="M3 12L12 3l9 9v9h-6v-6H9v6H3z"/></svg><div>Home</div></div>
    <div class="navitem" style="color:#0B2A5B;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#0B2A5B"><path d="M4 6l8-3 8 3-8 3z M4 6v6c0 2 4 4 8 4s8-2 8-4V6l-8 3z"/></svg><div>Learn</div></div>
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg><div>Practice</div></div>
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><path d="M4 8h16v11H4z M9 8V6h6v2 M4 13h16"/></svg><div>Opportunities</div></div>
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#94A3B8"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg><div>More</div></div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { label: 'All', bg: '#0B2A5B', fg: '#fff', labelColor: '#0B2A5B', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>' },
        { label: 'Tech & AI', bg: '#DBEAFE', fg: '#1D4ED8', labelColor: '#475569', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#1D4ED8"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>' },
        { label: 'Sustainability', bg: '#DCFCE7', fg: '#16A34A', labelColor: '#475569', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#16A34A"><path d="M4 20c0-8 6-14 16-16-1 10-7 16-16 16z"/></svg>' },
        { label: 'Finance', bg: '#DBEAFE', fg: '#1D4ED8', labelColor: '#475569', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#1D4ED8"><path d="M3 10L12 4l9 6v1H3v-1z M5 12h2v6H5z M11 12h2v6h-2z M17 12h2v6h-2z M3 20h18v2H3z"/></svg>' },
        { label: 'Life Skills', bg: '#EDE9FE', fg: '#7C3AED', labelColor: '#475569', icon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#7C3AED"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 5-6 8-6s7 2 8 6"/></svg>' },
      ],
      courses: [
        { title: 'AI for Everyone', sub: 'Build your future with AI', dur: '4 weeks', emoji: '🤖', imgBg: '#DBEAFE' },
        { title: 'Green Skills for a Sustainable India', sub: 'Learn. Contribute. Grow.', dur: '6 weeks', emoji: '🌿', imgBg: '#DCFCE7' },
        { title: 'Financial Literacy', sub: 'Smart choices. Brighter future.', dur: '3 weeks', emoji: '📈', imgBg: '#FEF3C7' },
      ],
    };
  }
}
</script>
</body>
</html>
