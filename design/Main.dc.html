<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
  body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #EEF3FA; color: #0B2A5B; }
  .phone { width: 390px; height: 844px; background: #ffffff; border-radius: 44px; overflow: hidden; position: relative; box-shadow: 0 30px 60px rgba(11,42,91,0.18), 0 0 0 10px #0B2A5B, 0 0 0 12px #1e3a70; margin: 24px auto; }
  .notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 112px; height: 28px; background: #0B2A5B; border-radius: 20px; z-index: 3; }
  .status { display: flex; justify-content: space-between; align-items: center; padding: 14px 28px 8px; font-size: 13px; font-weight: 700; color: #0B2A5B; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .brand .g { color: #22C55E; }
  .sub { color: #64748B; font-size: 11px; font-weight: 500; }
  .navitem { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 600; }
</style>
</helmet>
<div class="phone">
  <div class="notch"></div>
  <div class="status">
    <span>9:41</span>
    <span style="display:inline-flex; gap:6px; align-items:center;">
      <svg width="16" height="10" viewBox="0 0 16 10"><rect x="0" y="7" width="3" height="3" rx="0.5" fill="#0B2A5B"/><rect x="4" y="5" width="3" height="5" rx="0.5" fill="#0B2A5B"/><rect x="8" y="3" width="3" height="7" rx="0.5" fill="#0B2A5B"/><rect x="12" y="1" width="3" height="9" rx="0.5" fill="#0B2A5B"/></svg>
      <svg width="16" height="10" viewBox="0 0 16 10" fill="none" stroke="#0B2A5B" stroke-width="1.4" stroke-linecap="round"><path d="M1 4a10 10 0 0114 0"/><path d="M3.5 6a7 7 0 019 0"/><circle cx="8" cy="8.5" r="1" fill="#0B2A5B" stroke="none"/></svg>
      <svg width="24" height="12" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="20" height="10" rx="3" stroke="#0B2A5B" stroke-width="1.5"/><rect x="3" y="3" width="16" height="6" rx="1.5" fill="#0B2A5B"/><rect x="22" y="4" width="2" height="4" rx="1" fill="#0B2A5B"/></svg>
    </span>
  </div>

  <div style="padding: 6px 20px 4px; display: flex; justify-content: space-between; align-items: center;">
    <div>
      <div class="brand">Gen-<span class="g">Young</span> <svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:-1px"><path d="M4 20c0-8 6-14 16-16-1 10-7 16-16 16z" fill="#22C55E"/></svg></div>
      <div class="sub">More Opportunities. A Brighter You.</div>
    </div>
    <div style="display:flex; align-items:center; gap: 12px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2A5B" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>
      <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#FDE68A,#F87171); border: 2px solid #22C55E;"></div>
    </div>
  </div>

  <!-- Hero card -->
  <div style="margin: 12px 16px; background: linear-gradient(135deg,#0B2A5B,#1E3A8A); border-radius: 20px; padding: 16px; color: #fff; position: relative; overflow: hidden;">
    <div style="font-size: 20px; font-weight: 800; line-height: 1.15;">Discover Offers<br>Made for You</div>
    <div style="font-size: 12px; opacity: 0.85; margin-top: 6px;">Learn. Save. Experience. Grow.</div>
    <svg width="24" height="24" viewBox="0 0 24 24" style="position:absolute; top: 12px; right: 14px;"><path d="M4 20c0-8 6-14 16-16-1 10-7 16-16 16z" fill="#22C55E"/></svg>
    <div style="position: absolute; right: -10px; bottom: -10px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle,#3B82F6,transparent 70%); opacity: 0.4;"></div>
  </div>

  <!-- Category chip row -->
  <div style="display: flex; gap: 10px; padding: 4px 16px 12px; overflow: hidden;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 52px;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; border: {{c.border}};" innerHTML="{{c.icon}}"></div>
        <div style="font-size: 10.5px; font-weight: 700; color: {{c.labelColor}};">{{c.label}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 20px 8px;">
    <div style="font-weight: 800; color: #0B2A5B; font-size: 15px;">Featured for You</div>
    <a href="#" style="font-size: 12px; font-weight: 700; text-decoration: none; color: #0B2A5B;">See All</a>
  </div>

  <!-- Offer grid -->
  <div style="padding: 0 16px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
    <sc-for list="{{offers}}" as="o" hint-placeholder-count="4">
      <div style="background: {{o.cardBg}}; border: 1px solid #E2E8F0; border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 6px;">
        <div style="height: 46px; border-radius: 8px; background: {{o.imgBg}}; display: flex; align-items: center; justify-content: center; font-size: 22px;">{{o.imgEmoji}}</div>
        <div style="display: inline-block; background: {{o.tagBg}}; color: {{o.tagColor}}; font-size: 8.5px; font-weight: 800; padding: 2px 6px; border-radius: 4px; letter-spacing: 0.04em; align-self: flex-start;">{{o.tag}}</div>
        <div style="font-weight: 800; color: #0B2A5B; font-size: 12.5px; line-height: 1.2;">{{o.title}}</div>
        <div style="font-size: 10px; color: #64748B; line-height: 1.35;">{{o.sub}}</div>
        <button style="margin-top: 2px; width: 100%; background: {{o.btnBg}}; color: {{o.btnColor}}; border: none; padding: 6px 0; border-radius: 8px; font-weight: 800; font-size: 11px;">{{o.btnLabel}}</button>
      </div>
    </sc-for>
  </div>

  <!-- Bottom nav -->
  <div style="position: absolute; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #E2E8F0; padding: 10px 8px 22px; display: flex; justify-content: space-around;">
    <div class="navitem" style="color:#0B2A5B;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#0B2A5B"><path d="M3 12L12 3l9 9v9h-6v-6H9v6H3z"/></svg><div>Home</div></div>
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><path d="M4 7h16v13H4z"/><path d="M2 7h20v3H2z M12 22V7"/><path d="M12 7s-2-5-5-5-2 5 5 5-2-5 5-5 2 5-5 5"/></svg><div>Benefits</div></div>
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linejoin="round"><path d="M4 6l8-3 8 3-8 3-8-3z M4 6v6c0 2 4 4 8 4s8-2 8-4V6"/></svg><div>Learn</div></div>
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="#94A3B8"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg><div>Drop</div></div>
    <div class="navitem" style="color:#94A3B8;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 5-6 8-6s7 2 8 6"/></svg><div>Profile</div></div>
  </div>
</div>
</x-dc>

    return {

        { label: 'Learning', bg: '#F1F5F9', fg: '#0B2A5B', border: '1px solid #E2E8F0', labelColor: '#475569', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#0B2A5B"><path d="M12 3L1 8l11 5 9-4v6h2V8z M5 12v4c0 2 3 4 7 4s7-2 7-4v-4l-7 3z"/></svg>' },
        { label: 'Food', bg: '#F1F5F9', fg: '#EA580C', border: '1px solid #E2E8F0', labelColor: '#475569', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#EA580C"><path d="M4 10c0-3 4-6 8-6s8 3 8 6H4z M3 12h18l-1 3H4z M6 17h12l-1 3H7z"/></svg>' },
        { label: 'Travel', bg: '#F1F5F9', fg: '#7C3AED', border: '1px solid #E2E8F0', labelColor: '#475569', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#7C3AED"><path d="M2 16l3-1 5 3 4-1-8-6 2-1 10 4 4-1 2 2-2 2z"/></svg>' },
        { label: 'Lifestyle', bg: '#F1F5F9', fg: '#DB2777', border: '1px solid #E2E8F0', labelColor: '#475569', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="#DB2777"><path d="M5 8h14l-1 13H6z M9 8V6a3 3 0 016 0v2"/></svg>' },

        { tag: 'ENTERTAINMENT', tagBg: '#EDE9FE', tagColor: '#6D28D9', title: 'Movie Tickets', sub: 'Flat 50% off · Valid this weekend', btnLabel: 'Grab Offer', btnBg: '#7C3AED', btnColor: '#fff', cardBg: '#F5F3FF', imgBg: '#DDD6FE', imgEmoji: '🎬' },
      ],
    };

}

</body>
</html>
