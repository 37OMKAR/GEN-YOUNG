name: Deploy README landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/docs
          # README + reference PDF + all showcase images
          cp README.md _site/README.md
          cp GEN-YOUNG_50_Page_Concept_Paper.pdf _site/GEN-YOUNG_50_Page_Concept_Paper.pdf
          cp -r docs/assets _site/docs/assets
          # Landing page renders README client-side
          cp .github/pages/index.html _site/index.html

      - name: Configure Pages
        # ONE-TIME MANUAL STEP required before this workflow can succeed:
        #   Settings → Pages → Source → "GitHub Actions"
        # The default GITHUB_TOKEN lacks the admin scope needed to create a
        # Pages site programmatically, so `enablement: true` does not help.
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
